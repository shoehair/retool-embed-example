<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retool Embed Example</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #ddd; padding: .6rem 1rem; display: flex; gap: .75rem; align-items: center; }
    header h1 { font-size: 1rem; margin: 0; }
    header .spacer { flex: 1; }
    #who { font-size: .8rem; color: #666; }
    button { padding: .45rem .9rem; border: 0; border-radius: 6px; background: #e8e8e8; color: #333; cursor: pointer; }
    main { flex: 1; display: flex; padding: 1rem; }
    iframe { flex: 1; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
    [hidden] { display: none !important; }
    #status { flex: 1; display: grid; place-items: center; color: #999; border: 2px dashed #ddd; border-radius: 8px; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Retool Embed Example</h1>
    <div class="spacer"></div>
    <span id="who"></span>
    <form method="POST" action="/logout" style="margin:0"><button>Log out</button></form>
  </header>
  <main>
    <div id="status">Loading your Retool app…</div>
    <iframe id="frame" hidden allow="clipboard-read; clipboard-write"></iframe>
  </main>
  <script>
    const frame = document.getElementById('frame');
    const status = document.getElementById('status');

    fetch('/api/me')
      .then(r => r.json())
      .then(u => { document.getElementById('who').textContent = u.username; })
      .catch(() => {});

    // Ask our own backend for an embed URL, then frame it. The URL carries a
    // single-use nonce, so it is fetched fresh on every page load.
    (async () => {
      try {
        const resp = await fetch('/api/retool-embed', { method: 'POST' });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
        frame.src = data.embedUrl;
        frame.hidden = false;
        status.hidden = true;
      } catch (err) {
        status.textContent = err.message;
      }
    })();
  </script>
</body>
</html>
